# Giữ tối thiểu để không vỡ khi yazi đổi cú pháp (manager -> mgr từ 25.x).
# Editor mặc định lấy từ $EDITOR (nvim, đặt trong .zshrc).
[mgr]
ratio          = [1, 3, 4]
sort_by        = "natural"
sort_dir_first = true
show_hidden    = true
show_symlink   = true
linemode       = "size"

[preview]
max_width    = 600
max_height   = 900
image_quality = 75
