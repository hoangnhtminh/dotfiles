# starship — thay oh-my-posh (nhanh hơn, có sẵn trong repo extra của Arch)
add_newline = false
command_timeout = 500
format = """
$username$hostname$directory$git_branch$git_status$python$cmd_duration
$character"""
right_format = "$time"

[character]
success_symbol = "[❯](bold #e8824a)"
error_symbol   = "[❯](bold #e85a4a)"

[username]
format = "[$user]($style) "
style_user = "bold #e8824a"
style_root = "bold #e85a4a"
show_always = false

[hostname]
ssh_only = true
format = "[@$hostname]($style) "
style = "#b89880"

[directory]
style = "bold #e8c24a"
format = "[$path]($style)[$read_only]($read_only_style) "
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = " "
style = "#c4683a"
format = "[$symbol$branch]($style) "

[git_status]
style = "#e85a4a"
format = '([\[$all_status$ahead_behind\]]($style) )'

[python]
symbol = " "
style = "#4a98e8"
format = '[$symbol($version )(\($virtualenv\) )]($style)'
detect_extensions = []
detect_files = []

[cmd_duration]
min_time = 2000
style = "#7a5c45"
format = "[ $duration]($style) "

[time]
disabled = false
time_format = "%H:%M"
style = "#7a5c45"
format = "[$time]($style)"
