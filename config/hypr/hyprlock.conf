# hyprlock vẫn dùng cú pháp hyprlang (.conf).
# Nền đặc (không blur ảnh chụp màn hình) -> mở khóa/khóa tức thì, rất nhẹ.

general {
    hide_cursor         = true
    ignore_empty_input  = true
}

background {
    monitor =
    color   = rgba(26, 21, 18, 1.0)
}

label {
    monitor     =
    text        = cmd[update:30000] date +"%H:%M"
    color       = rgba(232, 130, 74, 1.0)
    font_size   = 88
    font_family = JetBrainsMono Nerd Font ExtraBold
    position    = 0, 140
    halign      = center
    valign      = center
}

label {
    monitor     =
    text        = cmd[update:60000] date +"%A, %d %B %Y"
    color       = rgba(184, 152, 128, 1.0)
    font_size   = 18
    font_family = JetBrainsMono Nerd Font
    position    = 0, 60
    halign      = center
    valign      = center
}

input-field {
    monitor            =
    size               = 300, 48
    outline_thickness  = 2
    dots_size          = 0.25
    dots_spacing       = 0.25
    dots_center        = true
    outer_color        = rgba(232, 130, 74, 1.0)
    inner_color        = rgba(36, 28, 23, 1.0)
    font_color         = rgba(232, 213, 196, 1.0)
    check_color        = rgba(232, 194, 74, 1.0)
    fail_color         = rgba(232, 90, 74, 1.0)
    fade_on_empty      = true
    placeholder_text   = <span foreground="##7a5c45">Mật khẩu…</span>
    fail_text          = Sai mật khẩu
    rounding           = 6
    position           = 0, -40
    halign             = center
    valign             = center
}
