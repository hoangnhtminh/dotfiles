# hypridle vẫn dùng cú pháp hyprlang (.conf) — KHÔNG phải Lua.
# Bản cũ chạy `hypridle` nhưng repo không có file này -> hypridle thoát ngay.

general {
    lock_cmd         = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd  = ~/.config/scripts/dpms.sh on
}

# 2.5 phút: giảm sáng (tiết kiệm pin)
listener {
    timeout    = 150
    on-timeout = brightnessctl -s set 10%
    on-resume  = brightnessctl -r
}

# 5 phút: khóa màn hình
listener {
    timeout    = 300
    on-timeout = loginctl lock-session
}

# 5.5 phút: tắt màn hình
listener {
    timeout    = 330
    on-timeout = ~/.config/scripts/dpms.sh off
    on-resume  = ~/.config/scripts/dpms.sh on
}

# 15 phút: ngủ
listener {
    timeout    = 900
    on-timeout = systemctl suspend
}
